# Pipeline de calidad del SaaS de facturación.
#
# El despliegue NO se hace aquí: GitLab replica el repositorio hacia GitHub
# (push mirror nativo) y Vercel despliega al detectar el cambio en GitHub.
# Este pipeline es el filtro de calidad de los merge requests: con la rama
# principal protegida, a `main` solo llega lo que ha pasado por aquí en verde.
#
# Si en el futuro se quiere un control más estricto —que el propio pipeline
# decida qué se replica— habría que desactivar el mirror nativo y añadir una
# etapa final `mirror-to-github` que haga `git push` solo tras pasar todo,
# usando un token de GitHub guardado como variable protegida.

stages:
  - calidad
  - pruebas
  - construir

default:
  image: node:22-bookworm
  interruptible: true
  # El único runner activo de la instancia (`cloudrun-ephemeral`) solo acepta
  # jobs con esta etiqueta. Sin ella los jobs se quedan en `pending` para siempre.
  tags:
    - cloudrun

variables:
  # Evita que npm intente escribir fuera del workspace del runner.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

# Cada job instala sus propias dependencias. El runner es efímero y su caché no
# se comparte entre jobs, y `node_modules` pesa demasiado para pasarlo como
# artefacto (el coordinador lo rechaza con 413), así que `npm ci` en cada job es
# lo más simple y lo más fiable: ~10 s con la caché de npm caliente.
.job_con_dependencias:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

lint:
  extends: .job_con_dependencias
  stage: calidad
  script:
    - npm run lint

typecheck:
  extends: .job_con_dependencias
  stage: calidad
  script:
    - npm run typecheck

formato:
  extends: .job_con_dependencias
  stage: calidad
  script:
    - npm run format:check

test:unit:
  extends: .job_con_dependencias
  stage: pruebas
  script:
    - npm run test:unit

# La suite E2E corre contra la misma infraestructura que en local. El runner
# usa el executor `shell` (sin Docker), así que `image:` y `services:` no se
# aplican: `scripts/ci-servicios.sh` descarga y arranca MongoDB, MailHog y
# RustFS como procesos, y Playwright instala su propio Chromium.
# El código de la aplicación no cambia: solo las variables de entorno.
test:e2e:
  extends: .job_con_dependencias
  stage: pruebas
  timeout: 25m
  variables:
    # 127.0.0.1 y no `localhost`: mongod solo escucha en IPv4 y Node 22 puede
    # resolver `localhost` primero a ::1.
    MONGODB_URI: "mongodb://127.0.0.1:27017"
    MONGODB_DB: "saas_facturacion"
    MAILHOG_HOST: "127.0.0.1"
    MAILHOG_PORT: "1025"
    MAILHOG_API_URL: "http://127.0.0.1:8025"
    EMAIL_PROVIDER: "mailhog"
    EMAIL_FROM: "Talonario <facturas@localhost>"
    AWS_URL: "http://127.0.0.1:9100"
    AWS_USERNAME: "rustfsadmin"
    AWS_PASSWORD: "rustfsadmin"
    AWS_REGION: "us-east-1"
    AWS_BUCKET: "facturacion"
    AWS_FORCE_PATH_STYLE: "true"
    APP_URL: "http://localhost:3000"
    E2E_BASE_URL: "http://localhost:3000"
    DEMO_EMAIL: "demo@talonario.test"
    # Secreto de usar y tirar: esta base se destruye al acabar el job.
    SESSION_SECRET: "secreto-solo-para-el-pipeline-de-integracion"
  script:
    - bash scripts/ci-servicios.sh
    - npx playwright install --with-deps chromium
    # `globalSetup` valida los servicios y siembra; el `webServer` de Playwright
    # arranca la aplicación.
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/

# Se ejecuta a propósito SIN ninguna variable de entorno: toda la configuración
# se lee de forma perezosa (`lib/env.ts`), así que compilar no debe requerir ni
# base de datos ni credenciales. Si alguien rompe esa propiedad, este job falla
# antes de que lo haga el primer despliegue de Vercel.
build:
  extends: .job_con_dependencias
  stage: construir
  script:
    - npm run build
